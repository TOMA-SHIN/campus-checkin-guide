<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="林墨的个人博客与作品集 - 技术与文字的交汇处">
  <title>墨客小栈 | 林墨的个人博客</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- 样式 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ======== 导航栏 ======== -->
  <nav class="blog-nav" id="blogNav">
    <div class="blog-nav-inner">
      <a href="#home" class="blog-logo">墨客小栈</a>
      <button class="blog-hamburger" id="blogHamburger" aria-label="切换菜单">
        <span></span><span></span><span></span>
      </button>
      <div class="blog-nav-links" id="blogNavLinks">
        <a href="#home" class="blog-nav-link" data-route="home">首页</a>
        <a href="#resume" class="blog-nav-link" data-route="resume">关于站长</a>
        <a href="#guestbook" class="blog-nav-link" data-route="guestbook">留言板</a>
      </div>
    </div>
  </nav>

  <!-- ======== 阅读进度条 ======== -->
  <blog-reading-progress></blog-reading-progress>

  <!-- ======== 主内容区 ======== -->
  <main id="blog-content" class="blog-content"></main>

  <!-- ======== 页脚 ======== -->
  <footer class="blog-footer" id="blogFooter">
    <div class="blog-footer-inner">
      <p>&copy; 2025 墨客小栈 · 林墨</p>
      <p class="blog-footer-motto">用代码书写思想，以文字记录时光</p>
    </div>
  </footer>

  <!-- ======== 全局组件 ======== -->
  <blog-back-to-top threshold="300"></blog-back-to-top>
  <blog-lightbox></blog-lightbox>
  <blog-toast></blog-toast>

  <!-- ======== JavaScript ======== -->
  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
